name: Build journal
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make setup check
      - if: github.event_name == 'push' && vars.PUBLISH_JOURNAL == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/
  deploy:
    if: github.event_name == 'push' && vars.PUBLISH_JOURNAL == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
